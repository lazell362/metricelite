[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[redirects]]
  from = "https://metricelite.com/*"
  to = "https://tipstersledger.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.metricelite.com/*"
  to = "https://tipstersledger.com/:splat"
  status = 301
  force = true

[functions."stripe-webhook"]
  included_files = []
